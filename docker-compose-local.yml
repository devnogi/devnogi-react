services:
  nextjs-app:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    ports:
      - "127.0.0.1:${PORT:-3010}:${PORT:-3010}"
    env_file:
      - .env.local
    environment:
      NODE_ENV: development
      PORT: ${PORT:-3010}
      GATEWAY_URL: ${GATEWAY_URL:-http://host.docker.internal:8090}
      API_MOCKING: ${API_MOCKING:-disabled}
      VERCEL_ENV: development
      NEXT_TELEMETRY_DISABLED: '1'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - node-modules:/app/node_modules
      - next-cache:/app/.next
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:${PORT:-3010}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  node-modules:
  next-cache:
