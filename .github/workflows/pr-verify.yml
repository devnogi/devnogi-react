name: Verify

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/secret-scan.mjs
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GATEWAY_URL: http://127.0.0.1:8090
      API_MOCKING: disabled
      VERCEL_ENV: development
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node --test scripts/test-production-workflow.mjs scripts/test-production-rollback.mjs
      - run: npm run verify
