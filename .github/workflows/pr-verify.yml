name: Verify

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node scripts/secret-scan.mjs
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORMAT_BASE_REF: refs/remotes/origin/${{ github.base_ref || 'main' }}
      GATEWAY_URL: http://127.0.0.1:8090
      API_MOCKING: disabled
      VERCEL_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node --test scripts/test-production-workflow.mjs scripts/test-production-rollback.mjs
      - run: npm run verify
  common-verification:
    uses: devnogi/ci-workflows/.github/workflows/node-ci.yml@5c46d7aff8ce452b72ad8f6c18bcb5a09828384d
    with:
      service-name: react
      dockerfile: Dockerfile
      compose-file: docker-compose-prod.yml
