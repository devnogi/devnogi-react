name: Production Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-production-deploy
  cancel-in-progress: false

jobs:
  ci-cd-prod:
    name: Test, Build, and Deploy to Production Server
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest

    steps:
      # ========================================
      # CI Stage: Test & Lint
      # ========================================
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Secret scan
        run: node scripts/secret-scan.mjs

      - name: Verify
        run: npm run verify
        env:
          GATEWAY_URL: http://127.0.0.1:8090
          API_MOCKING: disabled
          VERCEL_ENV: development
          NEXT_TELEMETRY_DISABLED: '1'

      # ========================================
      # CD Stage: Build & Push Docker Image
      # ========================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        id: image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64  # Multi-architecture build
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}:prod
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}:prod-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production
            NEXT_TELEMETRY_DISABLED=1

      # ========================================
      # Deploy Stage: SSH & Deploy
      # ========================================
      - name: Setup SSH key and config
        env:
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          set -e
          mkdir -p ~/.ssh

          # Write SSH private key (handle \n in secret)
          echo "${{ secrets.PROD_SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/my-key.pem
          chmod 600 ~/.ssh/my-key.pem

          # Verify key file was created
          if [ ! -s ~/.ssh/my-key.pem ]; then
            echo "Error: SSH key file is empty"
            exit 1
          fi

          echo "SSH key written successfully ($(wc -l < ~/.ssh/my-key.pem) lines)"

          test -n "$PROD_KNOWN_HOSTS" || { echo 'PROD_KNOWN_HOSTS is required' >&2; exit 1; }
          printf '%s\n' "$PROD_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # Require a previously verified host key.
          cat >> ~/.ssh/config << 'EOF'
          Host *
            ServerAliveInterval 60
            ServerAliveCountMax 3
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF

          echo "✓ SSH configuration complete"

      - name: Create app directory on server
        run: |
          ssh -i ~/.ssh/my-key.pem -p ${{ secrets.PROD_SSH_PORT }} ${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }} "mkdir -p ~/devnogi-react"

      - name: Copy deployment files to server
        run: |
          scp -i ~/.ssh/my-key.pem -P ${{ secrets.PROD_SSH_PORT }} docker-compose-prod.yml ${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }}:~/devnogi-react/.candidate-compose-${{ github.run_id }}-${{ github.run_attempt }}.yml

      - name: Deploy to Production Server
        run: |
          ssh -i ~/.ssh/my-key.pem -p ${{ secrets.PROD_SSH_PORT }} ${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }} << 'EOF'
            set -e
            umask 077
            cd ~/devnogi-react

            test -s docker-compose-prod.yml
            test -s .env.prod
            cp docker-compose-prod.yml .previous-compose.yml
            cp .env.prod .previous-env.prod
            # Write .env.prod content from GitHub Secret
            echo "${{ secrets.ENV_FILE_PROD }}" > .next-env.prod

            old_image=$(docker inspect --format '{{.Image}}' nextjs-app-prod 2>/dev/null || true)
            test -n "$old_image" || { echo 'No previous image available for rollback' >&2; exit 1; }
            printf '%s\n' "$old_image" > .previous-image-id
            export IMAGE_REF='${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}@${{ steps.image.outputs.digest }}'
            docker pull "$IMAGE_REF"
            printf '%s\n' '${{ github.run_id }}-${{ github.run_attempt }}' > .deployment-in-progress
            cp '.candidate-compose-${{ github.run_id }}-${{ github.run_attempt }}.yml' docker-compose-prod.yml
            cp .next-env.prod .env.prod
            docker compose -f docker-compose-prod.yml --env-file .env.prod up -d --no-deps nextjs-app

            echo "✅ Production deployment complete"
          EOF

      # ========================================
      # Health Check Stage (Stricter for Production)
      # ========================================
      - name: Comprehensive Health Check
        run: |
          ssh -i ~/.ssh/my-key.pem -p ${{ secrets.PROD_SSH_PORT }} ${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }} << 'EOF'
            set -e
            cd ~/devnogi-react
            echo "=== Starting Production Health Check ==="

            # 1. Check if Next.js container is running
            CONTAINER_ID=$(docker ps -q --filter "name=nextjs-app-prod")
            if [ -z "$CONTAINER_ID" ]; then
              echo "❌ Next.js container not running"
              docker ps -a
              docker logs nextjs-app-prod --tail 50
              exit 1
            fi
            echo "✅ Next.js container is running (ID: $CONTAINER_ID)"

            # 2. Wait for Docker health check (Next.js)
            echo "Waiting for Next.js container to become healthy..."
            for i in {1..36}; do
              HEALTH_STATUS=$(docker inspect --format='{{.State.Health.Status}}' nextjs-app-prod 2>/dev/null || echo "no-healthcheck")

              if [ "$HEALTH_STATUS" == "healthy" ]; then
                echo "✅ Next.js container is healthy"
                break
              elif [ "$HEALTH_STATUS" == "no-healthcheck" ]; then
                echo "⚠️  No healthcheck configured, checking endpoint directly"
                break
              fi

              echo "Current health status: $HEALTH_STATUS ($i/36)"
              sleep 10

              if [ $i -eq 36 ]; then
                echo "❌ Container failed to become healthy after 6 minutes"
                docker logs nextjs-app-prod --tail 100
                exit 1
              fi
            done

            # 3. Check Next.js health endpoint directly
            echo "Checking health endpoint (port 3010)..."
            for i in {1..30}; do
              HEALTH_RESPONSE=$(curl -s http://localhost:3010/api/health || echo "")

              if echo "$HEALTH_RESPONSE" | grep -q '"status":"ok"'; then
                echo "✅ Application health check passed"
                echo "Health response: $HEALTH_RESPONSE"
                break
              fi

              echo "Waiting for application to start... ($i/30)"
              sleep 10

              if [ $i -eq 30 ]; then
                echo "❌ Application health check failed after 5 minutes"
                echo "Last response: $HEALTH_RESPONSE"
                docker logs nextjs-app-prod --tail 100
                exit 1
              fi
            done

            # 4. Smoke test: Check if Next.js responds
            echo "Running smoke test..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3010/api/health)
            if [ "$HTTP_CODE" == "200" ]; then
              echo "✅ Smoke test passed (HTTP $HTTP_CODE)"
            else
              echo "❌ Smoke test failed (HTTP $HTTP_CODE)"
              exit 1
            fi

            echo "=== Health Check Complete ==="
            docker ps --filter "name=nextjs-app-prod"
            test "$(cat .deployment-in-progress)" = '${{ github.run_id }}-${{ github.run_attempt }}'
            rm -f .deployment-in-progress
          EOF

      - name: Display deployment info
        if: success()
        run: |
          echo "✅ Production deployment successful!"
          echo "🐳 Image digest: ${{ steps.image.outputs.digest }}"
          echo "📦 Commit: ${{ github.sha }}"

      # ========================================
      # Rollback on Failure
      # ========================================
      - name: Rollback on failure
        if: failure()
        run: |
          ssh -i ~/.ssh/my-key.pem -p ${{ secrets.PROD_SSH_PORT }} ${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }} << 'EOF'
            set -e
            cd ~/devnogi-react
            if [ "$(cat .deployment-in-progress 2>/dev/null || true)" != '${{ github.run_id }}-${{ github.run_attempt }}' ]; then
              echo 'No deployment started by this run; nothing to roll back.'
              exit 0
            fi
            test -s .previous-image-id
            test -s .previous-compose.yml
            test -s .previous-env.prod
            cp .previous-env.prod .env.prod
            export IMAGE_REF="$(cat .previous-image-id)"
            printf 'services:\n  nextjs-app:\n    image: "%s"\n' "$IMAGE_REF" > .rollback-image.yml
            docker compose -f .previous-compose.yml -f .rollback-image.yml --env-file .env.prod up -d --no-deps nextjs-app
            for i in $(seq 1 60); do
              if curl -fsS http://localhost:3010/api/health | grep -q '"status":"ok"'; then
                cp .previous-compose.yml docker-compose-prod.yml
                rm -f .deployment-in-progress
                echo 'Previous image restored and healthy.'
                exit 0
              fi
              sleep 10
            done
            echo 'Rollback health check failed.' >&2
            exit 1
          EOF
