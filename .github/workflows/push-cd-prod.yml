name: Production Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  production:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: devnogi/ci-workflows/.github/workflows/node-prod.yml@5c46d7aff8ce452b72ad8f6c18bcb5a09828384d
    with:
      service-name: react
      dockerfile: Dockerfile
      compose-file: docker-compose-prod.yml
      health-timeout: "600"
      platform: linux/amd64
    secrets: inherit
