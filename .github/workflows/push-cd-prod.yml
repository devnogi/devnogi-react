name: Production Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: react-production
  cancel-in-progress: false

jobs:
  workflow-contract:
    name: workflow-contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: Verify workflow contract
        run: node --test scripts/workflow-contract.test.mjs

  production:
    needs: workflow-contract
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: devnogi/ci-workflows/.github/workflows/node-prod.yml@2b4fbf8f7ab7403959f4641fe6d175b832ffe331
    with:
      service-name: react
      deployment-target: prod2
      dockerfile: Dockerfile
      compose-file: docker-compose-prod.yml
      health-timeout: "600"
      platform: linux/amd64
    secrets: inherit
